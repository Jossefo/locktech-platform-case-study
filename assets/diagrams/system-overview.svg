<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc"><title id="title">LockTech | system overview</title><desc id="desc">Inspected components and trust boundaries; current live delivery is not certified.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#526582"/></marker></defs><rect width="1100" height="850" fill="#f5f7fb"/><text x="32" y="42" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#14253e">LockTech | system overview</text><text x="32" y="72" font-family="Arial,sans-serif" font-size="15" fill="#425570">Inspected components and trust boundaries; current live delivery is not certified.</text><rect x="32" y="110" width="305" height="285" rx="14" fill="#e9eef8" stroke="#b4c0d6" stroke-dasharray="6 4"/><text x="50" y="138" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#253954">BROWSER | untrusted client</text><rect x="385" y="110" width="340" height="290" rx="14" fill="#e9eef8" stroke="#b4c0d6" stroke-dasharray="6 4"/><text x="403" y="138" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#253954">WORDPRESS | server</text><rect x="32" y="450" width="1035" height="300" rx="14" fill="#e9eef8" stroke="#b4c0d6" stroke-dasharray="6 4"/><text x="50" y="478" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#253954">SUPABASE | server boundary</text><polyline points="315,192 410,192" fill="none" stroke="#526582" stroke-width="2" marker-end="url(#arrow)"/><text x="322" y="178" font-family="Arial,sans-serif" font-size="13" fill="#253954" stroke="#f5f7fb" stroke-width="5" paint-order="stroke">Read / submit</text><polyline points="555,230 555,290" fill="none" stroke="#526582" stroke-width="2" marker-end="url(#arrow)"/><text x="570" y="265" font-family="Arial,sans-serif" font-size="13" fill="#253954" str