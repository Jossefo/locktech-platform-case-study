<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="810" viewBox="0 0 1100 810" role="img" aria-labelledby="title desc"><title id="title">LockTech | inquiry lifecycle</title><desc id="desc">Source-inspected flow; screenshots use independently seeded fictional CRM records.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#526582"/></marker></defs><rect width="1100" height="810" fill="#f5f7fb"/><text x="32" y="42" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#14253e">LockTech | inquiry lifecycle</text><text x="32" y="72" font-family="Arial,sans-serif" font-size="15" fill="#425570">Source-inspected flow; screenshots use independently seeded fictional CRM records.</text><polyline points="290,195 290,240" fill="none" stroke="#526582" stroke-width="2" marker-end="url(#arrow)"/><text x="305" y="222" font-family="Arial,sans-serif" font-size="13" fill="#253954" stroke="#f5f7fb" stroke-width="5" paint-order="stroke">Submit</text><polyline points="290,310 290,355" fill="none" stroke="#526582" stroke-width="2" marker-end="url(#arrow)"/><text x="305" y="337" font-family="Arial,sans-serif" font-size="13" fill="#253954" stroke="#f5f7fb" stroke-width="5" paint-order="stroke">Queue</text><polyline points="290,425 290,470" fill="none" stroke="#526582" stroke-width="2" marker-end="url(#arrow)"/><text x="305" y="452" font-family="Arial,sans-serif" font-size="13" fill="#253954" stroke="#f5f7fb" stroke-width="5" paint-order="stroke">Worker</text><polyline points="525,505 580,505 580,160 650,160" fill="none" stroke="#526582" stroke-width="2" marker-end="url(#arrow)"/><text x="585" y="350" font-family="Arial,sans-serif" font-size="13" fill="#253954" stroke="#f5f7fb" stroke-width="5" paint-order="stroke">Signed HTTPS</text><polyline points="845,195 845,240" fill="none" stroke="#526582" stroke-width="2" marker-end="url(#arrow)"/><text x="860" y="220" font-family="Arial,sans-serif" font-size="13" fill="#253954" stroke="#f5f7fb" stroke-width="5" paint-order="stroke">Atomic intake</text><polyline points="845,310 845,355" fill="none" stroke="#526582" stroke-width="2" marker-end="url(#arrow)"/><text x="860" y="335" font-family="Arial,sans-serif" font-size="13" fill="#253954" stroke="#f5f7fb" stroke-width="5" paint-order="stroke">Staff JWT + RLS</text><polyline points="845,425 845,470" fill="none" stroke="#526582" stroke-width="2" marker-end="url(#arrow)"/><text x="860" y="450" font-family="Arial,sans-serif" font-size="13" fill="#253954" stroke="#f5f7fb" stroke-width="5" paint-order="stroke">Prepare</text><polyline points="845,540 845,585" fill="none" stroke="#526582" stroke-width="2" marker-end="url(#arrow)"/><text x="860" y="565" font-family="Arial,sans-serif" font-size="13" fill="#253954" stroke="#f5f7fb" stroke-width="5" paint-order="stroke">Review and confirm</text><polyline points="290,540 290,625" fill="none" stroke="#526582" stroke-width="2" marker-end="url(#arrow)"/><text x="305" y="590" font-family="Arial,sans-serif" font-size="13" fill="#253954" stroke="#f5f7fb" stroke-width="5" paint-order="stroke">Failure</text><polyline points="55,660 35,660 35,505 55,505" fill="none" stroke="#526582" stroke-width="2" marker-end="url(#arrow)"/><text x="65" y="603" font-family="Arial,sans-serif" font-size="13" fill="#253954" stroke="#f5f7fb" stroke-width="5" paint-order="stroke">Retryable only</text><rect x="55" y="125" width="470" height="70" rx="10" fill="white" stroke="#2949b9" stroke-width="1.5"/><text x="290.0" y="152" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#14253e" font-weight="700">1  Customer browser</text><text x="290.0" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#14253e">Product selection + inquiry</text><rect x="55" y="240" width="470" height="70" rx="10" fill="white" stroke="#2949b9" stroke-width="1.5"/><text x="290.0" y="267" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#14253e" font-weight="700">2  WordPress server</text><text x="290.0" y="289" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#14253e">Persist original inquiry snapshot</text><rect x="55" y="355" width="470" height="70" rx="10" fill="white" stroke="#2949b9" stroke-width="1.5"/><text x="290.0" y="382" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#14253e" font-weight="700">3  WordPress server</text><text x="290.0" y="404" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#14253e">Enqueue outbox separately</text><rect x="55" y="470" width="470" height="70" rx="10" fill="white" stroke="#2949b9" stroke-width="1.5"/><text x="290.0" y="497" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#14253e" font-weight="700">4  Server worker</text><text x="290.0" y="519" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#14253e">Claim lease + sign exact delivery bytes</text><rect x="650" y="125" width="390" height="70" rx="10" fill="white" stroke="#2949b9" stroke-width="1.5"/><text x="845.0" y="152" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#14253e" font-weight="700">5  Intake Edge Function</text><text x="845.0" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#14253e">Validate HMAC + request envelope</text><rect x="650" y="240" width="390" height="70" rx="10" fill="white" stroke="#2949b9" stroke-width="1.5"/><text x="845.0" y="267" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#14253e" font-weight="700">6  Postgres transaction</text><text x="845.0" y="289" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#14253e">Replay or create inquiry / deal / task</text><rect x="650" y="355" width="390" height="70" rx="10" fill="white" stroke="#2949b9" stroke-width="1.5"/><text x="845.0" y="382" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#14253e" font-weight="700">7  Staff browser</text><text x="845.0" y="404" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#14253e">Work item + authoritative next task</text><rect x="650" y="470" width="390" height="70" rx="10" fill="white" stroke="#2949b9" stroke-width="1.5"/><text x="845.0" y="497" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#14253e" font-weight="700">8  Server draft</text><text x="845.0" y="519" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#14253e">Check revision before saving</text><rect x="650" y="585" width="390" height="70" rx="10" fill="white" stroke="#2949b9" stroke-width="1.5"/><text x="845.0" y="612" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#14253e" font-weight="700">9  Explicit server issuance</text><text x="845.0" y="634" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#14253e">Preserve immutable quote version</text><rect x="55" y="625" width="470" height="70" rx="10" fill="white" stroke="#2949b9" stroke-width="1.5"/><text x="290.0" y="652" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#14253e" font-weight="700">Delivery failure</text><text x="290.0" y="674" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#14253e">Retry with backoff / mark failed</text><text x="32" y="764" font-family="Arial,sans-serif" font-size="14" fill="#425570">Browser steps 1 and 7 cross different server boundaries; this is not one distributed transaction.</text><text x="32" y="785" font-family="Arial,sans-serif" font-size="14" fill="#425570">Delivery, hosted writes, public sharing and signing have not been re-executed in production.</text></svg>
